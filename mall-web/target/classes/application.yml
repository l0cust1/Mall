server:
  port: 6050
  servlet:
    context-path: /api
ws:
  port: 6051
spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  web:
    resources:
      static-locations: file:E:/java-ffmpeg-upload/
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/easymall?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&tinyInt1isBit=false
    username: root
    password: 131618
  task:
    scheduling:
      pool:
        size: 5
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  #elasticsearch相关
  elasticsearch:
    uris: http://localhost:9200
    #username: elastic  # 如果启用了安全认证
    #password: your_password
file:
  upload:
    path: E:/java-ffmpeg-upload/
mybatis:
  configuration:
    map-underscore-to-camel-case: true
#项目目录
project:
  folder: e:/webser/web_app/easymall/
admin:
  account: admin
  password: admin123
#日志级别
log:
  root:
    level: debug
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true  # 关闭自动下划线转换  # 关闭自动下划线转换
jwt:
  secret: "mySecretKeyForJWTGenerationAndValidation2025!@#$%^&*()_+ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefghijklmnopqrstuvwxyz"
  expiration: 86400000   # 24小时

# SpringDoc 接口文档配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.easymall.controller
  paths-to-match: /**
# ============ 支付宝配置 ============
alipay:
  # 沙箱网关地址
  gatewayUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  # APPID
  appId: 9021000165630812
  # 应用私钥（PKCS8格式，带换行符）
  appPrivateKey: ""
  # 支付宝公钥
  alipayPublicKey: ""
  # 字符集
  charset: UTF-8
  # 格式
  format: json# 同步跳转地址
  # 签名类型
  signType: RSA2
  # 异步通知地址
  notifyUrl: http://x5ce7da7.natappfree.cc/api/pay/callback
  # 同步跳转地址
  returnUrl: http://localhost:5174/orders


